[package]
name = "starcloud-launcher"
version = "0.2.0"
description = "Starcloud Minecraft Launcher - Tauri GUI"
authors = ["Starcloud Minecraft Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
dirs = "6"
# GUI 插件包（zip）解压
zip = "2"
# 核心库（无 tauri 依赖，CLI 与 GUI 共用）
starcloud-minecraft = { path = ".." }

[lib]
name = "starcloud_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
