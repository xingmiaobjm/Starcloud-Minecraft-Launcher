[package]
name = "starcloud-launcher"
# 启动器版本唯一来源：改这里即可（打包脚本会自动同步 tauri.conf.json / package.json，
# 后端 LAUNCHER_VERSION 与前端显示均通过 cargo 编译期注入 / Tauri 命令自动跟随）
version = "0.2.1"
description = "Starcloud Minecraft Launcher - Tauri GUI"
authors = ["Starcloud Minecraft Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol：直接 cargo build 运行的 exe 也走生产模式（嵌入 frontendDist），
# 不依赖 Vite dev server（devUrl localhost:1420）
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
dirs = "6"
chrono = "0.4"
# GUI 插件包（zip）解压
zip = "2"
# 核心库（无 tauri 依赖，CLI 与 GUI 共用）
starcloud-minecraft = { path = ".." }
# 系统信息（内存推荐命令）
sysinfo = "0.33"
# 系统原生「选择文件夹」对话框（Windows 资源管理器式目录选择）
rfd = "0.15"
# 窗口毛玻璃（Windows acrylic / Win10 blur）
window-vibrancy = "0.7"

# Windows DWM 窗口属性（深浅主题 / 圆角裁剪）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
raw-window-handle = "0.6"

[lib]
name = "starcloud_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
