# workspace 成员：核心库 + Tauri GUI（阶段 2 引入）
[workspace]
members = [".", "src-tauri"]
default-members = ["."]
resolver = "2"

[package]
name = "starcloud-minecraft"
version = "0.2.1"
edition = "2021"
description = "Minecraft 启动器核心模块 - 下载引擎、启动引擎、插件系统"
license = "MIT"
authors = ["Starcloud Minecraft Team"]

[lib]
name = "starcloud_minecraft"
path = "src/lib.rs"

[[bin]]
name = "starcloud-minecraft"
path = "src/main.rs"

[[example]]
name = "basic_launcher"
path = "examples/basic_launcher.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "blocking"] }
# 流式处理（响应体逐块读取）
futures-util = "0.3"
# JSON 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
# SHA1 校验
sha1 = { version = "0.10", package = "sha1" }
# SHA256（图标缓存文件名）
sha2 = "0.10"
# MD5（离线账户 UUID 生成）
md-5 = { version = "0.10", package = "md-5" }
# 文件操作
tempfile = "3"
# ZIP 解压
zip = "2"
# tar.gz 解压（陶瓦联机平台包）
flate2 = "1"
tar = "0.4"
# 动态库加载（插件系统）
libloading = "0.8"
# 错误处理
thiserror = "2"
anyhow = "1"
# UUID 生成
uuid = { version = "1", features = ["v4"] }
# 路径工具
dirs = "6"
# 缓存
lru = "0.12"
# 重试
backon = "1"
# 正则（版本号解析）
regex = "1"
# 配置文件
toml = "0.8"
# 信号量（并发控制）
tokio-util = { version = "0.7", features = ["full"] }
# 时间
chrono = { version = "0.4", features = ["serde"] }
# 百分比编码
percent-encoding = "2"
# 命令行解析
clap = { version = "4", features = ["derive"] }
# 终端输出美化
colored = "2"
# 系统信息（内存/磁盘推荐、自检）
sysinfo = "0.33"

[dev-dependencies]
# 测试用
env_logger = "0.11"
# 性能基准
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
# 模拟 HTTP
wiremock = "0.6"
# 快速测试
tempfile = "3"

[[bench]]
name = "download_bench"
harness = false

[[bench]]
name = "launch_bench"
harness = false

[features]
default = ["download", "launch", "plugin"]
download = []
launch = []
plugin = []
