    <!--
      DESIGN CONTRACT — Fluent Native（seed key 1fcf0ab6 / 用户指定方向：微软商店风格）
      THESIS: 把启动器做成 Windows 11 的"第 17 个系统应用"——用玩家最熟悉、最信任的
        本机商店质感，消解第三方启动器"来路不明"的心理门槛；拒绝深色电竞风与大面积玻璃拟物。
      OWN-WORLD: Mica 分层表面（#f3f3f3/#202020 底 + 白/#2b2b2b 卡片 + 1px 描边），
        Segoe UI Variable 字体栈，系统强调色为唯一 accent，4px 控件圆角 / 8px 浮层圆角，
        acrylic 模糊仅用于菜单与下拉，Fluent 标准缓动 cubic-bezier(0.1,0.9,0.2,1)。
      STORY: 玩家知道这是"和系统长在一起"的正经工具——选版本、点启动、看进度，
        每一步都有商店级的状态反馈；错误可复制、危险操作有确认、键盘全程可达。
      FIRST VIEWPORT: 首页 = 顶部 44px 自绘标题栏 + 左侧 NavigationView（激活项 pill）+
        状态栏（就绪/安装中/运行中/错误）+ 内容区大标题与版本选择卡、右侧巨型启动按钮。
      FORM: 用户指定方向（微软商店 + Win11 设置工艺基准），取代全部历史视觉方向。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
    -->

    <script type="module" src="/src/main.tsx"></script>
