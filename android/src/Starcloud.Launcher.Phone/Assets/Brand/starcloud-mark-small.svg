<svg xmlns="http://www.w3.org/2000/svg" viewBox="491 313 220 220" width="220" height="220" role="img" aria-label="Starcloud 标记 · 小尺寸">
  <title>Starcloud 标记 · 小尺寸单块版（16–24px 专用）</title>
  <!--
    Starcloud / 星云创新 · 小尺寸专用版
    16–24px 下只留"变数"本身：抬起的黄块与星，去掉三个空心方格。
    理由：该尺寸下 9px 描边只剩 0.14px，三个方格必然糊成脏点。
    倾斜 12° 保留 —— 它是标记的性格，不随尺寸妥协。
    32px 起请换回主标记 starcloud-mark-light.svg / -dark.svg。
  -->
  <g transform="translate(601,423) rotate(12) scale(1.08) translate(-601,-423)">
    <rect x="526" y="348" width="150" height="150" rx="34" fill="#FFD322"/>
    <path fill="#111418"
          d="M601,380 L614.28,408.72 L645.70,412.48 L622.24,433.98 L628.63,465.02 L601,449.6
             L573.37,465.02 L579.51,433.98 L556.30,412.48 L587.72,408.72 Z"/>
  </g>
</svg>
