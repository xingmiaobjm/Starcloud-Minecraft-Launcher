<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Starcloud Launcher</title>
    <!--
      字体用本地文件而不是 CDN：Linux 上没有 Segoe UI（WinUI3 的默认字体），
      也不该依赖网络。Inter 作为 Segoe UI Variable 的等宽替代。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
